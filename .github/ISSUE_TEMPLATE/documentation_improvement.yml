name: "Documentation improvement"
description: "Fix an error, ambiguity, or gap in the public docs or this explorer."
title: "[docs] "
labels: ["public-contribution", "documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where (page / section / URL)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
