# Steward detector suppressions.
#
# A suppression stops a finding ESCALATING. It never removes it from the report:
# a suppressed finding still appears in reports/steward_report.json with
# `"suppressed": true` and its reason attached, so nothing is hidden -- only
# de-prioritised. That distinction is the point. A suppression is a recorded
# DISPOSITION ("we looked, this is not a defect"), not a mute button.
#
# `finding_id` is `<detector>:<subject>` and may be an fnmatch pattern, so a
# whole class can be covered by one line (e.g. `D-001:*` or `*:MECH-099`).
# Always state a `reason` -- an unexplained suppression is how a real defect
# gets buried, and the runner reports entries that lack one.
#
# Seeded from docs/DETECTORS.md (preserved into the repo 2026-08-17; it lived
# only in an untracked directory on the Mac before that).
# Two of the three seeds were FORWARD-DECLARED for
# detectors stage 1 did not build. Both are still inert at stage 4, but for
# DIFFERENT reasons now -- see each entry.
#
# Keeping this file honest matters more than usual, because it is the Steward's
# own config and a stale disposition here is exactly the defect class D-007
# detects. When a detector lands, re-read the forward-declared entries and say
# plainly whether they became live: "becomes live when X lands" left standing
# after X has landed IS stale gate text.

suppressions:
  - finding_id: "D-001:MECH-099"
    reason: >-
      MECH-099 v3-in-v5, noted but not adjudicated. The claim declares
      implementation_phase v3 while its only owning node
      multi_agent_ecology_v5:MAE-3 lives in a generation:v5 plan. Known and
      recorded; no governance decision has been taken on which side is stale, so
      it should not consume escalation budget every cycle until one is.
    added: "2026-08-16"
    added_by: "chip-20260815-steward-stage1-detectors"
    review_after: "2026-11-16"

  - finding_id: "*:multi_agent_ecology_v5:MAE-3"
    reason: >-
      MAE-3 whole-plan back-pointer. A v5 roadmap plan back-pointing at v3 claims
      is a forward reference, not a defect. STATUS 2026-08-16 (stage 4): D-007 is
      now a node-subject detector, so the "becomes live when a node-level
      detector lands" condition has been met -- but this pattern still matches
      nothing, because a D-007 subject carries a `@cleared=...;named=...` suffix
      and this entry has no trailing wildcard. That is left DELIBERATELY as-is:
      the disposition recorded here is about a back-POINTER, and a stale GATE on
      MAE-3 would be a different question that should escalate on its own merits.
      Widen to "*:multi_agent_ecology_v5:MAE-3*" only if that second question is
      also dispositioned.
    added: "2026-08-16"
    added_by: "chip-20260815-steward-stage1-detectors"
    reviewed: "2026-08-16 (chip-20260816-steward-d007-stale-gate-reference)"
    forward_declared: true

  - finding_id: "*:V3-EXQ-732b"
    reason: >-
      V3-EXQ-732b is a deliberate refusal, not an omission -- the queue entry was
      declined on purpose and must not be re-surfaced as missing work.
      FORWARD-DECLARED: stage 1 builds no experiment-subject detector, so this
      matches nothing today. STATUS 2026-08-16 (stage 4): its intended owner was
      D-004 (phantom_owner_exq), which was RETIRED 2026-08-16 rather than built
      -- both the one-time fix (REE_assembly 4fa9f8199b) and the recurrence rule
      (REE_Working 67ce615f, morning-digest Step 7c DECLARED-not-owed exemption)
      landed instead. So this entry is now inert with no owner pending, not
      merely waiting. Kept because the underlying disposition (732b is a
      deliberate refusal) remains true and is worth not losing.
    added: "2026-08-16"
    added_by: "chip-20260815-steward-stage1-detectors"
    reviewed: "2026-08-16 (chip-20260816-steward-d007-stale-gate-reference)"
    forward_declared: true

