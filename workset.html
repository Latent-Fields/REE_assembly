<!doctype html>
<!-- WORKSET_VERSION: 2026-07-17.1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>REE Inter-Governance Workset</title>
<style>
  :root {
    --bg-0: #0d1117;
    --bg-1: #161b22;
    --bg-2: #1c2128;
    --bg-3: #22272e;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --st-ready: #2ea043;
    --st-flight: #58a6ff;
    --st-blocked: #f85149;
    --st-partial: #d29922;
    --leverage: #a371f7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-0); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
  }
  header.bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 18px; background: var(--bg-1);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header.bar h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header.bar .meta { color: var(--muted); font-size: 11px; }
  header.bar .links { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  header.bar .links a {
    color: var(--muted); text-decoration: none; font-size: 12px;
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px;
  }
  header.bar .links a:hover { color: var(--text); border-color: var(--accent); }
  .summary {
    padding: 12px 18px; background: var(--bg-1);
    border-bottom: 1px solid var(--border);
    display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px;
  }
  .summary .chip {
    padding: 4px 10px; border-radius: 12px; background: var(--bg-2);
    border: 1px solid var(--border);
  }
  .leverage-rail {
    padding: 8px 18px 10px;
    background: var(--bg-1);
    border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .leverage-rail .rail-label {
    font-size: 10px; font-weight: 700; color: var(--leverage);
    text-transform: uppercase; letter-spacing: 0.04em; margin-right: 4px;
  }
  .leverage-chip {
    font-size: 10px; padding: 4px 10px; border-radius: 10px;
    border: 1px solid var(--leverage); background: #a371f722;
    color: var(--text); cursor: pointer; max-width: 220px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .leverage-chip:hover { background: #a371f744; }
  .leverage-chip .cnt {
    margin-left: 4px; color: var(--leverage); font-weight: 700;
  }
  .toolbar {
    padding: 8px 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    border-bottom: 1px solid var(--border); background: var(--bg-0);
  }
  .toolbar label { font-size: 10px; color: var(--muted); margin-right: 2px; }
  .toolbar button, .toolbar select, .toolbar input {
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; font-size: 11px;
  }
  .toolbar button { cursor: pointer; }
  .toolbar button.active { background: var(--accent); color: #0d1117; font-weight: 600; }
  .toolbar input[type="search"] { min-width: 140px; }
  .toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .sections { padding: 0 18px 40px; }
  .section { margin-top: 16px; }
  .section-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding: 8px 0 10px; border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .section-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .section-head .sub { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
  .section-head .counts { font-size: 11px; color: var(--muted); margin-left: auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
    scroll-margin-top: 72px;
  }
  .card.pulse { animation: card-pulse 1.2s ease; }
  @keyframes card-pulse {
    0%, 100% { box-shadow: none; }
    40% { box-shadow: 0 0 0 2px var(--accent); }
  }
  .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card h3 { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.35; }
  .card .id { font-size: 10px; color: var(--muted); font-family: ui-monospace, monospace; }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .badge {
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    padding: 2px 6px; border-radius: 8px; letter-spacing: 0.03em;
  }
  .badge.lane { background: #388bfd33; color: #79c0ff; }
  .badge.status-ready { background: #2ea04333; color: #56d364; }
  .badge.status-in_flight { background: #58a6ff33; color: #79c0ff; }
  .badge.status-blocked, .badge.status-upstream_blocked { background: #f8514933; color: #ff7b72; }
  .badge.status-partial, .badge.status-in_progress { background: #d2992233; color: #e3b341; }
  .badge.leverage { background: #a371f733; color: #d2a8ff; }
  .badge.gen { background: #6e768133; color: #adbac7; letter-spacing: .3px; }
  .badge.gen.gen-v3 { background: #2ea04326; color: #56d364; }
  .badge.gen.gen-v4 { background: #388bfd26; color: #79c0ff; }
  .badge.gen.gen-v5 { background: #d2992226; color: #e3b341; }
  .badge.gen.gen-v6 { background: #a371f726; color: #d2a8ff; }
  .badge.plan-pill {
    background: var(--bg-3); color: var(--muted); text-transform: none;
    font-weight: 500; cursor: pointer;
  }
  .badge.plan-pill:hover { color: var(--accent); border-color: var(--accent); }
  .why { font-size: 11px; color: var(--muted); line-height: 1.4; }
  .claim-row { font-size: 10px; line-height: 1.5; }
  .claim-row .lbl { color: var(--muted); margin-right: 4px; }
  .claim-chip {
    display: inline-block; font-family: ui-monospace, monospace;
    padding: 1px 5px; margin: 1px 3px 1px 0;
    background: var(--bg-0); border: 1px solid var(--border); border-radius: 3px;
    font-size: 9px;
  }
  .claim-row.blocked-row .claim-chip { border-color: #f8514966; color: #ff7b72; }
  .assignments-row {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin-top: 6px; font-size: 11px;
  }
  .assignments-row .lbl { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .agent-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    border: 1px solid;
    cursor: default;
  }
  .agent-chip.agent-claude_local { background: #d2691e22; border-color: #d2691e88; color: #ffae6b; }
  .agent-chip.agent-cursor       { background: #58a6ff22; border-color: #58a6ff88; color: #79c0ff; }
  .agent-chip.agent-codex        { background: #56d36422; border-color: #56d36488; color: #7ee787; }
  .agent-chip.agent-other        { background: #a371f722; border-color: #a371f788; color: #d2a8ff; }
  .agent-chip.agent-spawned_task { background: #d4a72c22; border-color: #d4a72c88; color: #e3b341; }
  .agent-chip .src { color: var(--muted); font-size: 10px; }
  .agent-chip .release-x {
    margin-left: 2px;
    cursor: pointer;
    color: inherit;
    opacity: 0.5;
    background: transparent;
    border: none;
    padding: 0 2px;
    font-size: 12px;
    line-height: 1;
  }
  .agent-chip .release-x:hover { opacity: 1; color: #ff7b72; }
  .assign-btn {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    background: transparent;
    border: 1px dashed #30363d;
    color: var(--muted);
    cursor: pointer;
  }
  .assign-btn:hover { color: var(--accent); border-color: var(--accent); }
  .assign-menu {
    position: absolute;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 6px;
    z-index: 100;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    font-size: 11px;
    min-width: 160px;
  }
  .assign-menu button {
    display: block; width: 100%; text-align: left;
    background: transparent; border: none; color: var(--text);
    padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;
  }
  .assign-menu button:hover { background: #30363d; }
  .assign-menu input {
    width: 100%; box-sizing: border-box; margin: 4px 0;
    background: #0d1117; border: 1px solid #30363d; border-radius: 4px;
    color: var(--text); padding: 4px 6px; font-size: 11px;
  }
  .chip.assigned-pill { background: #d2691e33; color: #ffae6b; }
  .chip.recent-pill { background: #58a6ff22; color: #79c0ff; cursor: pointer; }
  .chip.recent-pill:hover { background: #58a6ff44; }
  #recent-activity {
    margin: 8px 0 14px 0;
    border: 1px solid #30363d;
    border-radius: 6px;
    background: #0d111780;
  }
  #recent-activity summary {
    cursor: pointer;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--muted);
    user-select: none;
  }
  #recent-activity summary:hover { color: var(--text); }
  #recent-activity[open] summary { border-bottom: 1px solid #30363d; }
  #recent-activity .ra-list { padding: 6px 0; max-height: 320px; overflow-y: auto; }
  #recent-activity .ra-row {
    display: grid;
    grid-template-columns: 110px 110px 70px 1fr 90px;
    gap: 10px;
    padding: 6px 12px;
    font-size: 11px;
    align-items: center;
    border-bottom: 1px solid #21262d;
  }
  #recent-activity .ra-row:last-child { border-bottom: none; }
  #recent-activity .ra-row:hover { background: #161b22; }
  #recent-activity .ra-row .ra-igw {
    font-family: ui-monospace, monospace;
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
  }
  #recent-activity .ra-row .ra-igw.ra-igw-stale { color: var(--muted); cursor: default; }
  #recent-activity .ra-row .ra-igw.ra-igw-stale:hover { text-decoration: none; }
  #recent-activity .ra-row .ra-title { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #recent-activity .ra-row .ra-when { color: var(--muted); font-family: ui-monospace, monospace; }
  #recent-activity .ra-row .ra-agent {
    font-family: ui-monospace, monospace;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    text-align: center;
  }
  #recent-activity .ra-row .ra-agent.agent-claude_local { background: #d2691e22; color: #ffae6b; }
  #recent-activity .ra-row .ra-agent.agent-cursor       { background: #58a6ff22; color: #79c0ff; }
  #recent-activity .ra-row .ra-agent.agent-codex        { background: #56d36422; color: #7ee787; }
  #recent-activity .ra-row .ra-agent.agent-other        { background: #a371f722; color: #d2a8ff; }
  #recent-activity .ra-row .ra-agent.agent-spawned_task { background: #d4a72c22; color: #e3b341; }
  #recent-activity .ra-row .ra-reason { color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #recent-activity .ra-empty { padding: 12px; font-size: 12px; color: var(--muted); }
  #recent-activity .ra-controls {
    padding: 6px 12px; display: flex; gap: 10px; align-items: center;
    border-bottom: 1px solid #21262d; font-size: 11px;
  }
  #recent-activity .ra-controls select {
    background: #0d1117; border: 1px solid #30363d; color: var(--text);
    padding: 2px 6px; border-radius: 4px; font-size: 11px;
  }
  .claim-row.unblocks-row .claim-chip { border-color: #2ea04355; }
  .meta-row { font-size: 10px; color: var(--muted); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .actions button, .actions a {
    font-size: 10px; padding: 4px 8px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg-3);
    color: var(--text); cursor: pointer; text-decoration: none;
  }
  .actions a.primary { border-color: var(--accent); color: var(--accent); }
  .actions button:hover, .actions a:hover { border-color: var(--accent); }
  .actions button.copied { border-color: var(--st-ready); color: var(--st-ready); }
  details.brief summary { cursor: pointer; font-size: 11px; color: var(--accent); }
  details.brief pre {
    margin: 8px 0 0; padding: 8px; background: var(--bg-0);
    border: 1px solid var(--border); border-radius: 4px;
    font-size: 10px; white-space: pre-wrap; max-height: 200px; overflow: auto;
  }
  .empty {
    padding: 40px 18px; text-align: center; color: var(--muted);
  }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--bg-3); border: 1px solid var(--st-ready);
    padding: 8px 16px; border-radius: 20px; font-size: 12px;
    opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="bar">
  <h1>Inter-Governance Workset</h1>
  <span class="meta" id="hdr-meta">loading...</span>
  <nav class="links">
    <a href="/explorer.html">Explorer</a>
    <a href="/closure">Closure (V3)</a>
    <a href="/machines">Machines</a>
    <a href="/brain-map">Brain Map</a>
  </nav>
</header>

<section class="summary" id="summary-bar"></section>
<details id="recent-activity">
  <summary>Recent activity (released assignments) -- <span id="ra-count">0</span></summary>
  <div class="ra-controls">
    <label for="ra-hours">Window</label>
    <select id="ra-hours">
      <option value="1">1h</option>
      <option value="6">6h</option>
      <option value="24" selected>24h</option>
      <option value="72">3d</option>
      <option value="168">7d</option>
    </select>
    <span style="color:var(--muted);font-size:10px;">Click an IGW id (when still in the workset) to scroll to its card.</span>
  </div>
  <div class="ra-list" id="ra-list"></div>
</details>
<section class="leverage-rail" id="leverage-rail" hidden></section>

<div class="toolbar" id="toolbar">
  <span style="color:var(--muted);font-size:11px;">Status</span>
  <button type="button" data-f="all" class="active">all</button>
  <button type="button" data-f="ready">ready</button>
  <button type="button" data-f="in_flight">in flight</button>
  <button type="button" data-f="blocked">blocked</button>
  <button type="button" data-f="assigned" title="Items currently handed to an agent (any kind: claude_local / cursor / codex / other). Matches the 'assigned' summary chip exactly.">assigned</button>
  <button type="button" data-f="pending_review" title="Governance items inserted by the generator when there are experiments awaiting review (lane=governance, skill=/governance). Will be empty when the review backlog is 0.">pending review</button>
  <button type="button" data-f="queue_pending" title="Items whose underlying EXQ is in the runner queue lifecycle but not currently executing on a runner (status=in_progress). The summary chip 'queue pending' counts queue entries directly, so the two counts can differ when a single queue entry spans multiple workset items or vice versa.">queue pending</button>
  <span class="sep"></span>
  <label for="group-by">Group</label>
  <select id="group-by">
    <option value="priority">Priority</option>
    <option value="plan">Plan</option>
    <option value="lane">Lane</option>
  </select>
  <label for="version-filter">Generation</label>
  <select id="version-filter" title="Filter by substrate generation. V3 = current active-substrate work (experiments, substrate builds, governance); V4/V5/V6 = forward-roadmap plan gaps kept out of the V3 closure percentage."><option value="">All generations</option></select>
  <label for="plan-filter">Plan</label>
  <select id="plan-filter"><option value="">All plans</option></select>
  <label for="lens-filter">Outcome</label>
  <select id="lens-filter"><option value="">All outcomes</option></select>
  <input type="search" id="claim-search" placeholder="Claim search (ARC-065)" autocomplete="off">
</div>

<div class="sections" id="sections"></div>
<div class="empty" id="empty" hidden></div>
<div id="toast"></div>

<script>
'use strict';

let WS = null;
let CLOSURE = null;
let STATUS_FILTER = 'all';
let GROUP_BY = 'priority';
let PLAN_FILTER = '';
let LENS_FILTER = '';
let VERSION_FILTER = '';
let CLAIM_SEARCH = '';
let RA = { count: 0, releases: [], hours: 24 };  // recent activity (released assignments)

const LANE_ORDER = ['governance', 'experiment', 'substrate', 'plan', 'lit', 'ops'];

async function load() {
  const wsRes = await fetch('/api/workset');
  WS = await wsRes.json();
  applyUrlParams();
  populateFilters();
  document.getElementById('hdr-meta').textContent =
    (WS.schema_version || '?') + ' | generated ' + (WS.generated_at || 'never') +
    ' | ' + (WS.items || []).length + ' packages';
  await loadRecentActivity();  // populate RA before summary so the chip count is right
  renderSummary();
  renderLeverageRail();
  renderAll();
  syncUrl();
  hydrateClosure();
}

async function loadRecentActivity() {
  try {
    const r = await fetch('/api/workset/recent_activity?hours=' + encodeURIComponent(RA.hours));
    const data = await r.json();
    RA.count = data.count || 0;
    RA.releases = data.releases || [];
  } catch (e) {
    RA.count = 0; RA.releases = [];
  }
  renderRecentActivity();
}

function renderRecentActivity() {
  const list = document.getElementById('ra-list');
  const summary = document.querySelector('#recent-activity summary');
  if (summary) {
    const c = document.getElementById('ra-count');
    if (c) c.textContent = String(RA.count) + (RA.hours !== 24 ? ' in last ' + RA.hours + 'h' : '');
  }
  if (!list) return;
  if (!RA.releases.length) {
    list.innerHTML = '<div class="ra-empty">No released assignments in this window. ' +
      'Released entries appear here when a routine-spawned agent session ends or you click the X on a chip.</div>';
    return;
  }
  // Build a set of IGW ids still present in the current workset for scroll-link styling.
  const liveIds = new Set((WS && WS.items || []).map(it => it.id));
  list.innerHTML = RA.releases.map(r => {
    const snap = r.item_snapshot || {};
    const igw = r.igw_id_at_assign || '?';
    const live = liveIds.has(igw);
    const igwHtml = live
      ? '<a class="ra-igw" data-scroll="' + escapeAttr(igw) + '" href="#card-' + escapeAttr(igw) + '">' + escapeHtml(igw) + '</a>'
      : '<span class="ra-igw ra-igw-stale" title="No longer in current workset (gap likely closed).">' + escapeHtml(igw) + '</span>';
    const when = formatReleaseWindow(r.assigned_at, r.released_at);
    const agentLabel = (r.agent === 'other' && r.agent_label) ? r.agent_label : (r.agent || '?');
    return '<div class="ra-row">' +
      igwHtml +
      '<span class="ra-when" title="assigned ' + escapeAttr(r.assigned_at || '') +
        '\nreleased ' + escapeAttr(r.released_at || '') + '">' + escapeHtml(when) + '</span>' +
      '<span class="ra-agent agent-' + escapeAttr(r.agent || 'other') + '">' + escapeHtml(agentLabel) + '</span>' +
      '<span class="ra-title" title="' + escapeAttr(snap.title || '') + '">' + escapeHtml(snap.title || '(no title in snapshot)') + '</span>' +
      '<span class="ra-reason" title="' + escapeAttr(r.released_reason || '') +
        ' (source: ' + escapeAttr(r.source || '?') + ')">' +
        escapeHtml(r.released_reason || r.source || '') + '</span>' +
      '</div>';
  }).join('');
  list.querySelectorAll('.ra-igw[data-scroll]').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const id = a.getAttribute('data-scroll');
      const card = document.getElementById('card-' + id);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('pulse');
        setTimeout(() => card.classList.remove('pulse'), 1200);
      }
    });
  });
}

function formatReleaseWindow(assignedAt, releasedAt) {
  if (!releasedAt) return '?';
  // "released Hh ago" relative or absolute UTC HH:MM
  try {
    const rel = new Date(releasedAt);
    const now = new Date();
    const minsAgo = Math.max(0, Math.round((now - rel) / 60000));
    if (minsAgo < 60) return minsAgo + 'm ago';
    if (minsAgo < 60 * 24) return Math.round(minsAgo / 60) + 'h ago';
    return Math.round(minsAgo / (60 * 24)) + 'd ago';
  } catch (e) {
    return releasedAt.slice(11, 16) + 'Z';
  }
}

function hydrateClosure() {
  // CLOSURE is supplemental (plan-title enrichment for the filter dropdown).
  // The /api/closure endpoint can be slow when the coordinator hop is flaky,
  // so we fetch it after the main render and re-populate the plan dropdown
  // once it arrives. AbortController gives us a hard client-side deadline.
  const ctrl = new AbortController();
  const deadline = setTimeout(() => ctrl.abort(), 8000);
  fetch('/api/closure', { signal: ctrl.signal })
    .then(r => (r && r.ok) ? r.json() : null)
    .then(data => {
      clearTimeout(deadline);
      if (!data) return;
      CLOSURE = data;
      mergeClosurePlansIntoFilter();
    })
    .catch(() => { clearTimeout(deadline); });
}

function mergeClosurePlansIntoFilter() {
  const planSel = document.getElementById('plan-filter');
  if (!planSel || !CLOSURE || !CLOSURE.plans) return;
  const existing = new Set(Array.from(planSel.options).map(o => o.value));
  for (const pl of CLOSURE.plans) {
    if (existing.has(pl.id)) continue;
    const opt = document.createElement('option');
    opt.value = pl.id;
    opt.textContent = pl.title || pl.id;
    planSel.appendChild(opt);
  }
  if (PLAN_FILTER && existing.size && planSel.value !== PLAN_FILTER) {
    planSel.value = PLAN_FILTER;
  }
}

function applyUrlParams() {
  const p = new URLSearchParams(location.search);
  const g = p.get('group');
  if (g === 'plan' || g === 'lane' || g === 'priority') GROUP_BY = g;
  const plan = p.get('plan');
  if (plan) PLAN_FILTER = plan;
  const lens = p.get('lens');
  if (lens) LENS_FILTER = lens;
  const ver = p.get('version');
  if (ver) VERSION_FILTER = ver;
  const q = p.get('q');
  if (q) CLAIM_SEARCH = q;
  const f = p.get('status');
  if (f) STATUS_FILTER = f;
}

function syncUrl() {
  const p = new URLSearchParams();
  if (GROUP_BY !== 'priority') p.set('group', GROUP_BY);
  if (PLAN_FILTER) p.set('plan', PLAN_FILTER);
  if (LENS_FILTER) p.set('lens', LENS_FILTER);
  if (VERSION_FILTER) p.set('version', VERSION_FILTER);
  if (CLAIM_SEARCH.trim()) p.set('q', CLAIM_SEARCH.trim());
  if (STATUS_FILTER !== 'all') p.set('status', STATUS_FILTER);
  const qs = p.toString();
  const url = qs ? '?' + qs : location.pathname;
  history.replaceState(null, '', url);
}

function populateFilters() {
  const groupSel = document.getElementById('group-by');
  groupSel.value = GROUP_BY;
  groupSel.addEventListener('change', () => {
    GROUP_BY = groupSel.value;
    renderAll();
    syncUrl();
  });

  const planSel = document.getElementById('plan-filter');
  const plans = new Map();
  if (WS.plans) {
    for (const [pid, info] of Object.entries(WS.plans)) {
      plans.set(pid, info.title || pid);
    }
  }
  if (CLOSURE && CLOSURE.plans) {
    for (const pl of CLOSURE.plans) {
      if (!plans.has(pl.id)) plans.set(pl.id, pl.title || pl.id);
    }
  }
  for (const it of WS.items || []) {
    if (it.plan_id) {
      plans.set(it.plan_id, it.plan_title || plans.get(it.plan_id) || it.plan_id);
    }
  }
  for (const [pid, title] of [...plans.entries()].sort((a, b) => a[1].localeCompare(b[1]))) {
    const opt = document.createElement('option');
    opt.value = pid;
    opt.textContent = title;
    planSel.appendChild(opt);
  }
  if (PLAN_FILTER) planSel.value = PLAN_FILTER;
  planSel.addEventListener('change', () => {
    PLAN_FILTER = planSel.value;
    renderAll();
    syncUrl();
  });

  const lensSel = document.getElementById('lens-filter');
  const lenses = WS.lenses || {};
  for (const [lid, meta] of Object.entries(lenses).sort((a, b) =>
    (a[1].label || a[0]).localeCompare(b[1].label || b[0]))) {
    const opt = document.createElement('option');
    opt.value = lid;
    const cnt = meta.item_count != null ? ' (' + meta.item_count + ')' : '';
    opt.textContent = (meta.label || lid) + cnt;
    lensSel.appendChild(opt);
  }
  if (LENS_FILTER) lensSel.value = LENS_FILTER;
  lensSel.addEventListener('change', () => {
    LENS_FILTER = lensSel.value;
    renderAll();
    syncUrl();
  });

  const verSel = document.getElementById('version-filter');
  // Prefer the generator's summary.by_version count; fall back to counting items.
  const byVer = (WS.summary && WS.summary.by_version) || {};
  const verCounts = Object.keys(byVer).length
    ? byVer
    : (WS.items || []).reduce((acc, it) => {
        const v = it.version || 'v3';
        acc[v] = (acc[v] || 0) + 1;
        return acc;
      }, {});
  for (const v of Object.keys(verCounts).sort()) {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v.toUpperCase() + ' (' + verCounts[v] + ')';
    verSel.appendChild(opt);
  }
  if (VERSION_FILTER) verSel.value = VERSION_FILTER;
  verSel.addEventListener('change', () => {
    VERSION_FILTER = verSel.value;
    renderAll();
    syncUrl();
  });

  const search = document.getElementById('claim-search');
  search.value = CLAIM_SEARCH;
  let searchTimer = null;
  search.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      CLAIM_SEARCH = search.value;
      renderAll();
      syncUrl();
    }, 200);
  });

  document.getElementById('toolbar').querySelectorAll('button[data-f]').forEach(btn => {
    btn.addEventListener('click', () => {
      STATUS_FILTER = btn.getAttribute('data-f') || 'all';
      document.querySelectorAll('#toolbar button[data-f]').forEach(b =>
        b.classList.toggle('active', b === btn));
      renderAll();
      syncUrl();
    });
    if (btn.getAttribute('data-f') === STATUS_FILTER) btn.classList.add('active');
    else if (STATUS_FILTER !== 'all') btn.classList.remove('active');
  });
  if (STATUS_FILTER !== 'all') {
    document.querySelector('#toolbar button[data-f="all"]').classList.remove('active');
    const active = document.querySelector('#toolbar button[data-f="' + STATUS_FILTER + '"]');
    if (active) active.classList.add('active');
  }
}

function isBlockedStatus(st) {
  return st === 'blocked' || st === 'upstream_blocked';
}

function matchStatusFilter(it) {
  if (STATUS_FILTER === 'all') return true;
  if (STATUS_FILTER === 'blocked') return isBlockedStatus(it.status);
  if (STATUS_FILTER === 'assigned') return (it.assignments || []).length > 0;
  if (STATUS_FILTER === 'pending_review') {
    // Governance-lane items inserted by the generator when
    // pending_review_count > 0. Both lane and skill are 'governance' /
    // '/governance'; either match qualifies.
    return it.lane === 'governance' || it.skill === '/governance';
  }
  if (STATUS_FILTER === 'queue_pending') {
    // Workset-level expression of "the EXQ is in the queue but not
    // currently running". in_flight is its own button (live on a runner).
    return it.status === 'in_progress';
  }
  return it.status === STATUS_FILTER;
}

function matchLensFilter(it) {
  if (!LENS_FILTER) return true;
  const ml = it.matched_lenses || [];
  return ml.indexOf(LENS_FILTER) >= 0;
}

function matchPlanFilter(it) {
  if (!PLAN_FILTER) return true;
  return it.plan_id === PLAN_FILTER;
}

function matchVersionFilter(it) {
  if (!VERSION_FILTER) return true;
  return (it.version || 'v3') === VERSION_FILTER;
}

function matchClaimSearch(it) {
  const q = CLAIM_SEARCH.trim().toUpperCase();
  if (!q) return true;
  const blob = [
    it.title, it.why_now,
    (it.claim_ids || []).join(' '),
    (it.unblocks || []).join(' '),
    (it.gap_ids || []).join(' '),
    it.plan_id,
  ].join(' ').toUpperCase();
  return blob.indexOf(q) >= 0;
}

function filterItems() {
  return (WS.items || []).filter(it =>
    matchStatusFilter(it) && matchLensFilter(it) &&
    matchPlanFilter(it) && matchVersionFilter(it) && matchClaimSearch(it));
}

function isHighLeverage(it) {
  const st = it.status;
  if (st !== 'ready' && st !== 'partial') return false;
  const uc = it.unblock_count != null ? it.unblock_count : (it.unblocks || []).length;
  return uc >= 3 || it.severity === 'load-bearing';
}

function renderLeverageRail() {
  const el = document.getElementById('leverage-rail');
  const items = (WS.items || [])
    .filter(isHighLeverage)
    .sort((a, b) => {
      const ua = a.unblock_count != null ? a.unblock_count : (a.unblocks || []).length;
      const ub = b.unblock_count != null ? b.unblock_count : (b.unblocks || []).length;
      if (ub !== ua) return ub - ua;
      return (a.priority || 99) - (b.priority || 99);
    })
    .slice(0, 10);
  if (!items.length) { el.hidden = true; return; }
  el.hidden = false;
  let html = '<span class="rail-label">Unblocks most</span>';
  for (const it of items) {
    const uc = it.unblock_count != null ? it.unblock_count : (it.unblocks || []).length;
    const short = (it.title || it.id || '').slice(0, 48);
    html += '<span class="leverage-chip" data-scroll="' + escapeAttr(it.id) + '" title="' +
      escapeAttr(it.title || '') + '">' + escapeHtml(short) +
      '<span class="cnt">' + uc + '</span></span>';
  }
  el.innerHTML = html;
  el.querySelectorAll('.leverage-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const id = chip.getAttribute('data-scroll');
      const card = document.getElementById('card-' + id);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('pulse');
        setTimeout(() => card.classList.remove('pulse'), 1200);
      }
    });
  });
}

function statusSortKey(st) {
  const order = { ready: 0, partial: 1, in_progress: 2, in_flight: 3, blocked: 4, upstream_blocked: 5 };
  return order[st] != null ? order[st] : 6;
}

function sortItems(items) {
  return items.slice().sort((a, b) => {
    const sa = statusSortKey(a.status);
    const sb = statusSortKey(b.status);
    if (sa !== sb) return sa - sb;
    return (a.priority || 99) - (b.priority || 99);
  });
}

function planTitle(pid) {
  if (!pid) return 'Other queues';
  const it = (WS.items || []).find(x => x.plan_id === pid && x.plan_title);
  if (it && it.plan_title) return it.plan_title;
  if (WS.plans && WS.plans[pid]) return WS.plans[pid].title || pid;
  if (CLOSURE && CLOSURE.plans) {
    const pl = CLOSURE.plans.find(p => p.id === pid);
    if (pl) return pl.title || pid;
  }
  return pid.replace(/_/g, ' ');
}

function sectionCounts(items) {
  const c = { ready: 0, blocked: 0, other: 0 };
  for (const it of items) {
    if (it.status === 'ready') c.ready++;
    else if (isBlockedStatus(it.status)) c.blocked++;
    else c.other++;
  }
  const parts = [];
  if (c.ready) parts.push(c.ready + ' ready');
  if (c.blocked) parts.push(c.blocked + ' blocked');
  if (c.other) parts.push(c.other + ' other');
  return parts.join(', ') || '0 items';
}

function buildSections(items) {
  const sorted = sortItems(items);
  if (GROUP_BY === 'priority') {
    return [{ key: '_flat', title: null, items: sorted }];
  }
  if (GROUP_BY === 'lane') {
    const byLane = {};
    for (const it of sorted) {
      const lane = it.lane || 'other';
      (byLane[lane] = byLane[lane] || []).push(it);
    }
    return LANE_ORDER.concat(Object.keys(byLane))
      .filter((v, i, a) => a.indexOf(v) === i && byLane[v])
      .map(lane => ({
        key: lane,
        title: lane,
        subtitle: 'lane',
        items: byLane[lane],
      }));
  }
  const byPlan = {};
  const other = [];
  for (const it of sorted) {
    if (it.plan_id) {
      (byPlan[it.plan_id] = byPlan[it.plan_id] || []).push(it);
    } else {
      other.push(it);
    }
  }
  const sections = Object.keys(byPlan).sort((a, b) =>
    planTitle(a).localeCompare(planTitle(b))).map(pid => ({
    key: pid,
    title: planTitle(pid),
    subtitle: pid,
    items: byPlan[pid],
  }));
  if (other.length) {
    sections.push({ key: '_other', title: 'Other queues', subtitle: 'substrate, governance, ops', items: other });
  }
  return sections;
}

function renderCard(it) {
  const stCls = 'status-' + (it.status || 'ready').replace(/-/g, '_');
  const ver = (it.version || 'v3');
  let badges =
    '<span class="badge lane">' + escapeHtml(it.lane || '?') + '</span>' +
    '<span class="badge ' + stCls + '">' + escapeHtml(it.status || '?') + '</span>' +
    '<span class="badge gen gen-' + escapeAttr(ver) + '" title="Substrate generation">' + escapeHtml(ver.toUpperCase()) + '</span>' +
    '<span class="badge">P' + escapeHtml(String(it.priority != null ? it.priority : '?')) + '</span>';
  const uc = it.unblock_count != null ? it.unblock_count : (it.unblocks || []).length;
  if (uc >= 3 && it.status === 'ready') {
    badges += '<span class="badge leverage">HIGH</span>';
  }
  if (it.severity) {
    badges += '<span class="badge">' + escapeHtml(it.severity) + '</span>';
  }
  if (it.plan_id) {
    badges += '<span class="badge plan-pill" data-plan="' + escapeAttr(it.plan_id) + '">' +
      escapeHtml(it.plan_title || it.plan_id) + '</span>';
  }

  let unblocksHtml = '';
  const ub = it.unblocks || [];
  if (ub.length) {
    const show = ub.slice(0, 6);
    const more = ub.length > 6 ? ' +' + (ub.length - 6) : '';
    unblocksHtml = '<div class="claim-row unblocks-row"><span class="lbl">Unblocks:</span>' +
      show.map(c => '<span class="claim-chip">' + escapeHtml(c) + '</span>').join('') +
      (more ? '<span class="claim-chip">' + escapeHtml(more) + '</span>' : '') + '</div>';
  }

  let blockedHtml = '';
  if (it.blocked_by && it.blocked_by.length) {
    blockedHtml = '<div class="claim-row blocked-row"><span class="lbl">Blocked by:</span>' +
      it.blocked_by.map(b => '<span class="claim-chip">' + escapeHtml(b) + '</span>').join('') +
      '</div>';
  }

  let meta = '';
  if (it.owner_exq) meta += 'EXQ: ' + escapeHtml(it.owner_exq) + ' | ';
  if (it.gap_ids && it.gap_ids.length) meta += 'gap: ' + escapeHtml(it.gap_ids.join(', '));

  // Active agent assignments (from evidence/planning/igw_assignments.json,
  // merged onto each item by generate_inter_governance_workset.py).
  const asgn = it.assignments || [];
  let asgnHtml = '<div class="assignments-row"><span class="lbl">Agent:</span>';
  if (asgn.length) {
    asgnHtml += asgn.map(a => {
      const label = a.agent === 'other' && a.agent_label ? a.agent_label : a.agent;
      const srcTag = a.source === 'igw_routine_tick' ? 'auto' : 'manual';
      const when = (a.assigned_at || '').replace('T', ' ').replace('Z', '');
      const tooltip = 'agent=' + (a.agent || '?') +
        (a.agent_label ? ' label=' + a.agent_label : '') +
        ' source=' + (a.source || '?') +
        ' assigned=' + (a.assigned_at || '?') +
        (a.note ? '\nnote: ' + a.note : '');
      return '<span class="agent-chip agent-' + escapeAttr(a.agent || 'other') + '" title="' + escapeAttr(tooltip) + '">' +
        escapeHtml(label) + ' <span class="src">(' + srcTag + ')</span>' +
        '<button class="release-x" data-release-stable="' + escapeAttr(it.stable_hash || '') + '"' +
        ' data-release-agent="' + escapeAttr(a.agent || '') + '"' +
        ' data-release-label="' + escapeAttr(a.agent_label || '') + '"' +
        ' title="Release assignment">x</button>' +
        '</span>';
    }).join('');
  }
  asgnHtml += '<button class="assign-btn" data-assign-id="' + escapeAttr(it.id) + '">+ assign</button>' +
    '</div>';

  const closureHref = (it.closure_links && it.closure_links[0]) ? it.closure_links[0] : '';
  const actions =
    '<button type="button" data-copy="' + escapeAttr(it.agent_brief || '') + '">Copy brief</button>' +
    (closureHref
      ? '<a class="primary" href="' + escapeHtml(closureHref) + '" target="_blank" rel="noopener">Closure map</a>'
      : '');

  return '<article class="card" id="card-' + escapeAttr(it.id) + '">' +
    '<div class="top"><div><div class="id">' + escapeHtml(it.id || '') + '</div>' +
    '<h3>' + escapeHtml(it.title || '') + '</h3></div></div>' +
    '<div class="badges">' + badges + '</div>' +
    '<div class="why">' + escapeHtml(it.why_now || '') + '</div>' +
    unblocksHtml + blockedHtml +
    asgnHtml +
    '<div class="meta-row">Skill: <code>' + escapeHtml(it.skill || '') + '</code>' +
    (meta ? ' | ' + meta : '') + '</div>' +
    '<details class="brief"><summary>Agent brief</summary><pre>' +
    escapeHtml(it.agent_brief || '') + '</pre></details>' +
    '<div class="actions">' + actions + '</div></article>';
}

function renderAll() {
  const items = filterItems();
  const sections = buildSections(items);
  const root = document.getElementById('sections');
  const empty = document.getElementById('empty');
  root.innerHTML = '';

  if (!items.length) {
    empty.hidden = false;
    empty.textContent = WS.empty_note ||
      'No work packages match these filters. Run /inter-governance-brief to regenerate.';
    return;
  }
  empty.hidden = true;

  for (const sec of sections) {
    const wrap = document.createElement('div');
    wrap.className = 'section';
    if (sec.key !== '_flat') {
      const head = document.createElement('div');
      head.className = 'section-head';
      head.innerHTML =
        '<h2>' + escapeHtml(sec.title || sec.key) + '</h2>' +
        (sec.subtitle ? '<span class="sub">' + escapeHtml(sec.subtitle) + '</span>' : '') +
        '<span class="counts">' + escapeHtml(sectionCounts(sec.items)) + '</span>';
      wrap.appendChild(head);
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.innerHTML = sec.items.map(renderCard).join('');
    wrap.appendChild(grid);
    root.appendChild(wrap);
  }

  root.querySelectorAll('button[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => copyText(btn.getAttribute('data-copy'), btn));
  });
  root.querySelectorAll('button.release-x').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const stable = btn.getAttribute('data-release-stable');
      const agent = btn.getAttribute('data-release-agent');
      const label = btn.getAttribute('data-release-label') || null;
      if (!stable || !agent) return;
      releaseAssignment(stable, agent, label);
    });
  });
  root.querySelectorAll('button.assign-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openAssignMenu(btn, btn.getAttribute('data-assign-id'));
    });
  });
  root.querySelectorAll('.plan-pill').forEach(pill => {
    pill.addEventListener('click', (e) => {
      e.stopPropagation();
      PLAN_FILTER = pill.getAttribute('data-plan') || '';
      GROUP_BY = 'plan';
      document.getElementById('plan-filter').value = PLAN_FILTER;
      document.getElementById('group-by').value = GROUP_BY;
      renderAll();
      syncUrl();
    });
  });

  if (LENS_FILTER || PLAN_FILTER || VERSION_FILTER || CLAIM_SEARCH.trim()) {
    const first = root.querySelector('.card');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function markCopied(btn) {
    btn.classList.add('copied');
    btn.textContent = 'Copied';
    toast('Brief copied to clipboard');
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'Copy brief'; }, 1500);
}

function copyViaTextarea(text) {
  const ta = document.createElement('textarea');
  ta.value = text || '';
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (_) {
    ok = false;
  } finally {
    document.body.removeChild(ta);
  }
  return ok;
}

function copyText(text, btn) {
  const payload = text || '';
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(payload).then(() => markCopied(btn)).catch(() => {
      if (copyViaTextarea(payload)) markCopied(btn);
      else toast('Copy failed -- select text in brief panel');
    });
    return;
  }
  if (copyViaTextarea(payload)) markCopied(btn);
  else toast('Copy failed -- select text in brief panel');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ---- Agent assignment menu (manual /api/workset/assign) ----

const AGENT_KINDS = ['claude_local', 'cursor', 'codex', 'other'];

function closeAssignMenu() {
  document.querySelectorAll('.assign-menu').forEach(m => m.remove());
}

function openAssignMenu(anchorBtn, igwId) {
  closeAssignMenu();
  const menu = document.createElement('div');
  menu.className = 'assign-menu';
  // Position below the button.
  const rect = anchorBtn.getBoundingClientRect();
  menu.style.left = (window.scrollX + rect.left) + 'px';
  menu.style.top = (window.scrollY + rect.bottom + 4) + 'px';

  for (const kind of AGENT_KINDS) {
    if (kind === 'other') continue;
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = kind;
    b.addEventListener('click', () => {
      closeAssignMenu();
      assignToAgent(igwId, kind, null);
    });
    menu.appendChild(b);
  }
  // "other" with free-text label.
  const sep = document.createElement('div');
  sep.style.cssText = 'border-top: 1px solid #30363d; margin: 4px 0;';
  menu.appendChild(sep);
  const lab = document.createElement('div');
  lab.textContent = 'other:';
  lab.style.cssText = 'font-size: 10px; color: var(--muted); padding: 2px 4px;';
  menu.appendChild(lab);
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'agent label (e.g. aider, teammate)';
  input.maxLength = 80;
  menu.appendChild(input);
  const okBtn = document.createElement('button');
  okBtn.type = 'button';
  okBtn.textContent = 'assign as other';
  okBtn.addEventListener('click', () => {
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    closeAssignMenu();
    assignToAgent(igwId, 'other', v);
  });
  menu.appendChild(okBtn);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { okBtn.click(); }
    else if (e.key === 'Escape') { closeAssignMenu(); }
  });

  document.body.appendChild(menu);
  setTimeout(() => input.focus(), 0);

  // Click-outside dismisses.
  setTimeout(() => {
    document.addEventListener('click', _outside, { once: true, capture: true });
  }, 0);
  function _outside(e) {
    if (menu.contains(e.target)) {
      document.addEventListener('click', _outside, { once: true, capture: true });
    } else {
      closeAssignMenu();
    }
  }
}

function assignToAgent(igwId, agent, agentLabel) {
  fetch('/api/workset/assign', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      igw_id: igwId,
      agent: agent,
      agent_label: agentLabel,
      source: 'manual_ui',
    }),
  }).then(r => r.json()).then(res => {
    if (res.status === 'ok' || res.status === 'noop') {
      toast(res.status === 'noop' ? 'Already assigned' : ('Assigned to ' + (agentLabel || agent)));
      load();
    } else {
      toast('Assign failed: ' + (res.message || 'unknown'));
    }
  }).catch(err => toast('Assign failed: ' + err));
}

function releaseAssignment(stableHash, agent, agentLabel) {
  fetch('/api/workset/release', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      stable_hash: stableHash,
      agent: agent,
      agent_label: agentLabel,
      released_by: 'manual_ui',
    }),
  }).then(r => r.json()).then(res => {
    if (res.status === 'ok' || res.status === 'noop') {
      toast('Released');
      load();
    } else {
      toast('Release failed: ' + (res.message || 'unknown'));
    }
  }).catch(err => toast('Release failed: ' + err));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

// Wire the Recent activity hours dropdown + summary-chip click-through.
const _raHoursSel = document.getElementById('ra-hours');
if (_raHoursSel) {
  _raHoursSel.addEventListener('change', () => {
    const h = parseFloat(_raHoursSel.value);
    if (!isNaN(h) && h > 0) {
      RA.hours = h;
      loadRecentActivity();
    }
  });
}
document.addEventListener('click', (e) => {
  const chip = e.target.closest('#recent-summary-chip');
  if (chip) {
    const panel = document.getElementById('recent-activity');
    if (panel) {
      panel.open = true;
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
});

load();
</script>
</body>
</html>
